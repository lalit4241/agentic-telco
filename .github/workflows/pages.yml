# Publishes the password-gated replay (web/dist/index.html) to GitHub Pages.
# The page is built from the committed recording; the password comes from the repo secret DEMO_PASSWORD
# (Settings → Secrets → Actions). It is never stored in the repo or printed.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build gated page
        working-directory: web
        env:
          TF_DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          test -n "$TF_DEMO_PASSWORD" || { echo "Set the DEMO_PASSWORD repo secret"; exit 1; }
          node build.js
          npm test
          mkdir -p ../_site && cp dist/index.html ../_site/index.html && touch ../_site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
